<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理者画面 — Snowboard Finder</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:20px}
  h1{font-size:22px;color:#1a1a2e;margin-bottom:6px}
  .sub{color:#666;font-size:13px;margin-bottom:24px}
  .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:24px}
  h2{font-size:16px;color:#1a1a2e;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #e8ecf0}
  label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:4px;margin-top:14px}
  label:first-of-type{margin-top:0}
  input[type=text],input[type=url],input[type=number],select,textarea{
    width:100%;border:1.5px solid #dde3ec;border-radius:8px;padding:9px 12px;
    font-size:14px;outline:none;transition:border .15s}
  input:focus,select:focus,textarea:focus{border-color:#4a90d9}
  textarea{resize:vertical;min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .check-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .check-group label{
    font-weight:500;font-size:13px;color:#333;
    background:#f4f6f9;border:1.5px solid #dde3ec;
    border-radius:20px;padding:5px 13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;margin:0;transition:all .15s}
  .check-group input[type=checkbox]{display:none}
  .check-group input:checked + span{font-weight:700}
  .check-group label:has(input:checked){background:#e8f0fd;border-color:#4a90d9;color:#1a5ccf}
  .flex-row{display:flex;align-items:center;gap:12px}
  input[type=range]{flex:1;accent-color:#4a90d9}
  .flex-val{font-size:20px;font-weight:800;color:#1a5ccf;min-width:24px;text-align:center}
  .flex-label{font-size:12px;color:#888;min-width:120px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;
    border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
  .btn-primary{background:#2d6ab5;color:#fff}
  .btn-primary:hover{background:#1a5499}
  .btn-danger{background:#e53935;color:#fff;padding:7px 14px;font-size:13px}
  .btn-danger:hover{background:#c62828}
  .btn-secondary{background:#eee;color:#333}
  .btn-secondary:hover{background:#ddd}
  #login-wrap{max-width:400px;margin:80px auto}
  #app{max-width:820px;margin:0 auto;display:none}
  .tag{display:inline-block;background:#e8f0fd;color:#1a5ccf;border-radius:12px;
    padding:3px 10px;font-size:12px;font-weight:600;margin:2px}
  .board-item{border:1.5px solid #e8ecf0;border-radius:10px;padding:14px 16px;
    margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .board-item-info{flex:1}
  .board-item h3{font-size:15px;color:#1a1a2e;margin-bottom:4px}
  .board-item .meta{font-size:12px;color:#888;margin-bottom:6px}
  .rak-badge{background:#bf360c;color:#fff;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:10px;margin-left:6px}
  .empty{text-align:center;color:#aaa;padding:32px;font-size:14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#323232;color:#fff;padding:12px 24px;border-radius:8px;
    font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  .toast.show{opacity:1}
  @media(max-width:600px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ログイン -->
<div id="login-wrap">
  <div class="card">
    <h2 style="text-align:center;border:none;margin-bottom:20px">🔐 管理者ログイン</h2>
    <label>パスワード</label>
    <input type="password" id="pw-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-primary" onclick="login()" style="width:100%;margin-top:16px;justify-content:center">ログイン</button>
    <p id="pw-err" style="color:#e53935;font-size:13px;margin-top:10px;text-align:center;display:none">パスワードが違います</p>
  </div>
</div>

<!-- 管理画面 -->
<div id="app">
  <h1>🏂 Snowboard Finder — 管理者画面</h1>
  <p class="sub">板を追加するとサイトの検索結果に反映されます。<a href="index.html" target="_blank" style="color:#2d6ab5">← サイトを開く</a></p>

  <!-- 追加フォーム -->
  <div class="card">
    <h2>＋ 板を追加</h2>

    <div class="row2">
      <div>
        <label>ブランド名</label>
        <input type="text" id="f-brand" placeholder="例: Nitro">
      </div>
      <div>
        <label>モデル名</label>
        <input type="text" id="f-model" placeholder="例: Team">
      </div>
    </div>

    <label>フレックス（1=超ソフト ↔ 10=超ハード）</label>
    <div class="flex-row">
      <input type="range" id="f-flex" min="1" max="10" value="5" oninput="updateFlexLabel()">
      <div class="flex-val" id="f-flex-val">5</div>
      <div class="flex-label" id="f-flex-desc">ミディアム — オールラウンド</div>
    </div>

    <label>スタイル（複数選択可）</label>
    <div class="check-group" id="f-styles">
      <label><input type="checkbox" value="all-mountain"><span>🏔 オールマウンテン</span></label>
      <label><input type="checkbox" value="freestyle"><span>🤸 フリースタイル</span></label>
      <label><input type="checkbox" value="powder"><span>💨 パウダー</span></label>
      <label><input type="checkbox" value="carving"><span>⚡ カービング</span></label>
      <label><input type="checkbox" value="park"><span>🎪 パーク・ジブ</span></label>
      <label><input type="checkbox" value="gratri"><span>💃 グラトリ</span></label>
    </div>

    <label>対象レベル（複数選択可）</label>
    <div class="check-group" id="f-levels">
      <label><input type="checkbox" value="beginner"><span>初心者</span></label>
      <label><input type="checkbox" value="intermediate"><span>中級者</span></label>
      <label><input type="checkbox" value="advanced"><span>上級者</span></label>
      <label><input type="checkbox" value="expert"><span>エキスパート</span></label>
    </div>

    <div class="row2">
      <div>
        <label>シェイプ</label>
        <input type="text" id="f-shape" placeholder="例: ツイン、ディレクショナル">
      </div>
      <div>
        <label>プロファイル</label>
        <input type="text" id="f-profile" placeholder="例: キャンバー、ロッカー">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>価格帯</label>
        <input type="text" id="f-price" placeholder="例: ¥80,000〜95,000">
      </div>
      <div>
        <label>対応サイズ（カンマ区切り）</label>
        <input type="text" id="f-lengths" placeholder="例: 148,151,154,157,160">
      </div>
    </div>

    <label>ハイライト（1行1項目、最大3つ）</label>
    <textarea id="f-highlights" placeholder="例:&#10;カービングに最高&#10;パウダー浮力◎&#10;初心者にもやさしい"></textarea>

    <label>ブランド公式URL</label>
    <input type="url" id="f-url" placeholder="https://www.example.com">

    <label>楽天アフィリエイトURL（あれば）</label>
    <input type="url" id="f-rakuten" placeholder="https://hb.afl.rakuten.co.jp/...">

    <div class="row2" style="margin-top:14px">
      <div>
        <label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;font-weight:500">
          <input type="checkbox" id="f-isJP"> 日本ブランド
        </label>
      </div>
      <div>
        <label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;font-weight:500">
          <input type="checkbox" id="f-isWomens"> 女性向け
        </label>
      </div>
    </div>

    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn btn-primary" onclick="addBoard()">＋ 追加する</button>
      <button class="btn btn-secondary" onclick="clearForm()">クリア</button>
    </div>
  </div>

  <!-- 登録済みリスト -->
  <div class="card">
    <h2>登録済みの板 <span id="board-count" style="font-size:13px;color:#888;font-weight:400"></span></h2>
    <div id="board-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── パスワード（変更する場合はここを編集） ──
const ADMIN_PASS = 'snow2025';

function login() {
  if (document.getElementById('pw-input').value === ADMIN_PASS) {
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderList();
  } else {
    document.getElementById('pw-err').style.display = 'block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

function updateFlexLabel() {
  const v = +document.getElementById('f-flex').value;
  document.getElementById('f-flex-val').textContent = v;
  document.getElementById('f-flex-desc').textContent =
    v<=2?'超ソフト — グラトリ初心者':v<=4?'ソフト — グラトリ・フリースタイル':
    v<=6?'ミディアム — オールラウンド':v<=8?'ミディアムハード — カービング':'超ハード — 競技・アルペン';
}

function getChecked(groupId) {
  return [...document.querySelectorAll(`#${groupId} input:checked`)].map(i => i.value);
}

function addBoard() {
  const brand = document.getElementById('f-brand').value.trim();
  const model = document.getElementById('f-model').value.trim();
  if (!brand || !model) { showToast('⚠️ ブランドとモデル名は必須です'); return; }

  const flex   = +document.getElementById('f-flex').value;
  const styles = getChecked('f-styles');
  const levels = getChecked('f-levels');
  if (!styles.length) { showToast('⚠️ スタイルを1つ以上選択してください'); return; }
  if (!levels.length) { showToast('⚠️ レベルを1つ以上選択してください'); return; }

  const highlightRaw = document.getElementById('f-highlights').value;
  const highlights = highlightRaw.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);
  const lengthsRaw = document.getElementById('f-lengths').value;
  const lengths = lengthsRaw ? lengthsRaw.split(',').map(s=>+s.trim()).filter(n=>n>0) : [];
  const rakutenUrl = document.getElementById('f-rakuten').value.trim();

  const board = {
    brand, model, flex, styles, levels,
    isJP:  document.getElementById('f-isJP').checked,
    isRak: !!rakutenUrl,
    isWomens: document.getElementById('f-isWomens').checked,
    seasons: ['25-26','26-27'],
    shape:  document.getElementById('f-shape').value.trim() || 'ツイン',
    profile: document.getElementById('f-profile').value.trim() || 'キャンバー',
    price:  document.getElementById('f-price').value.trim() || '要問合せ',
    highlights: highlights.length ? highlights : [model],
    url:    document.getElementById('f-url').value.trim() || '',
    lengths,
    rakutenUrl,
    _custom: true,
    _id: Date.now(),
  };

  const boards = getBoards();
  boards.push(board);
  saveBoards(boards);
  clearForm();
  renderList();
  showToast(`✅ ${brand} ${model} を追加しました`);
}

function deleteBoard(id) {
  if (!confirm('この板を削除しますか？')) return;
  const boards = getBoards().filter(b => b._id !== id);
  saveBoards(boards);
  renderList();
  showToast('🗑️ 削除しました');
}

function getBoards() {
  try { return JSON.parse(localStorage.getItem('customBoards') || '[]'); } catch(e) { return []; }
}
function saveBoards(arr) {
  localStorage.setItem('customBoards', JSON.stringify(arr));
}

function renderList() {
  const boards = getBoards();
  document.getElementById('board-count').textContent = `(${boards.length}件)`;
  const el = document.getElementById('board-list');
  if (!boards.length) { el.innerHTML = '<div class="empty">まだ板が登録されていません</div>'; return; }
  el.innerHTML = boards.map(b => `
    <div class="board-item">
      <div class="board-item-info">
        <h3>${b.brand} ${b.model}
          ${b.isRak ? '<span class="rak-badge">楽天あり</span>' : ''}
          ${b.isJP ? '<span style="background:#e8f5e9;color:#2e7d32;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:4px">日本</span>' : ''}
        </h3>
        <div class="meta">フレックス: ${b.flex} ／ ${b.styles.join('・')} ／ ${b.levels.join('・')}</div>
        <div>${b.highlights.map(h=>`<span class="tag">${h}</span>`).join('')}</div>
      </div>
      <button class="btn btn-danger" onclick="deleteBoard(${b._id})">削除</button>
    </div>
  `).join('');
}

function clearForm() {
  ['f-brand','f-model','f-shape','f-profile','f-price','f-lengths','f-highlights','f-url','f-rakuten'].forEach(id=>{
    document.getElementById(id).value='';
  });
  document.getElementById('f-flex').value = 5;
  updateFlexLabel();
  document.querySelectorAll('#f-styles input, #f-levels input').forEach(i=>i.checked=false);
  document.getElementById('f-isJP').checked = false;
  document.getElementById('f-isWomens').checked = false;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

updateFlexLabel();
</script>
</body>
</html>
